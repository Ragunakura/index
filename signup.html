<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | WordHarbor</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

<header>

    <nav class="navbar">

        <div class="logo">
            WordHarbor
        </div>

        <div class="menu-toggle" id="menuToggle">
            ☰
        </div>

        <ul class="nav-links">

            <li><a href="index.html">Home</a></li>

            <li><a href="blog.html">Explore</a></li>

            <li><a href="#">Categories</a></li>

            <li><a href="admin.html">Write</a></li>

            <li><a href="#">Community</a></li>

            <li><a href="about.html">About</a></li>

        </ul>

        <div class="nav-buttons">

            <a href="login.html" class="login-btn">Log In</a>

            <a href="signup.html" class="signup-btn">Sign Up</a>

        </div>

        <button id="themeToggle" class="theme-btn">
            🌙
        </button>

    </nav>

</header>

<section class="auth-container">

    <h1>Create Your Account</h1>

    <p>
        Join WordHarbour and become part of a community where every story finds a home.
    </p>

    <br>

    <form id="signupForm">

        <input type="text" id="fullName" placeholder="Full Name" required>

    <br><br>

    <input type="text" id="username" placeholder="Username" required>

    <br><br>

    <input type="email" id="email" placeholder="Email Address" required>

    <br><br>

    <input type="password" id="password" placeholder="Create Password" required>

    <br><br>

    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

    <br><br>

        <button class="btn" type="submit">
            Create Account
        </button>

    </form>

    <p style="margin-top:25px;">

        Already have an account?

        <a href="login.html">

            Log In

        </a>

    </p>

</section>

<button id="topBtn">↑</button>
<script type="module" src="firebase/firebase.js"></script>
<script type="module" src="js/auth.js"></script>
<script src="js/script.js"></script>

</body>

</html>
